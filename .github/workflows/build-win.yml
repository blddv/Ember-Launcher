name: Build Windows installer

on:
  push:
    branches: [arena/8bde5889-ember-launcher]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Upload exe to release 2.0.6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "2.0.6" "dist/EMBER Launcher Setup 2.0.6.exe" --clobber

      # Запасной вариант: exe остаётся артефактом сборки, его можно скачать со страницы запуска
      - name: Keep exe as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Launcher-Setup-2-0-6
          path: dist/EMBER Launcher Setup 2.0.6.exe
          if-no-files-found: ignore
