name: Build Windows installer

on:
  push:
    branches: [arena/fe796923-ember-launcher]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Versions
        shell: bash
        run: |
          node -v
          npm -v
          npx electron-builder --version

      # Имя установщика и тег релиза берём из package.json, чтобы не править workflow на каждую версию
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "exe=EMBER Launcher Setup $VER.exe" >> "$GITHUB_OUTPUT"
          echo "Собираем версию $VER"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        id: build
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee dist-log.txt

      - name: Report failure details
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::$(tail -c 3500 dist-log.txt | tr '\n' ' | ')"
          {
            echo "## Build log tail"
            echo '```'
            tail -n 50 dist-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI: лог ошибки сборки $(date -u +%FT%TZ)" \
            --body "$(tail -n 60 dist-log.txt)" || true

      - name: Upload exe to release ${{ steps.ver.outputs.version }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          EXE="dist/${{ steps.ver.outputs.exe }}"
          # Релиз создаётся заранее; если его нет — создаём из этого коммита
          gh release view "$VER" >/dev/null 2>&1 || \
            gh release create "$VER" --target "$GITHUB_SHA" --title "Ember launcher $VER" \
              --notes "Установщик Windows: EMBER Launcher Setup $VER.exe"
          gh release upload "$VER" "$EXE" --clobber

      # Запасной вариант: exe остаётся артефактом сборки, его можно скачать со страницы запуска
      - name: Keep exe as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Launcher-Setup-${{ steps.ver.outputs.version }}
          path: dist/${{ steps.ver.outputs.exe }}
          if-no-files-found: ignore
