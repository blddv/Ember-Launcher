name: Build Linux only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to attach builds to
        required: true
        default: 2.2.3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --linux --x64 --publish never 2>&1 | tee dist-log.txt

      - name: Failure log
        if: failure()
        shell: bash
        run: tail -n 60 dist-log.txt

      - name: Attach Linux builds to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.deb dist/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux artifacts were built" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > dist/SHA256SUMS.txt
          printf 'Uploading to %s:\n' "$RELEASE_TAG"
          printf '  %s\n' "${files[@]}" dist/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "${files[@]}" dist/SHA256SUMS.txt --clobber
