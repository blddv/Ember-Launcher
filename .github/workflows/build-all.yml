name: Build all platforms

on:
  push:
    branches: [arena/8bde5889-ember-launcher]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --x64 --publish never
            artifact: dist/EMBER Launcher Setup *.exe
            name: windows-setup
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --x64 --publish never
            artifact: dist/EMBER-Launcher-*-linux-x64.*
            name: linux
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
            artifact: dist/EMBER-Launcher-*-mac-*
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.cmd }} 2>&1 | tee dist-log.txt

      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          echo "::error::$(tail -c 3500 dist-log.txt | tr '\n' ' | ')"
          {
            echo "## Build log tail"
            echo '```'
            tail -n 50 dist-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep builds as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Launcher-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: ignore
